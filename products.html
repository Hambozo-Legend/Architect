<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SuperMarket - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1>SuperMarket</h1>
        <a href="index.html">Dashboard</a>
        <a href="products.html" class="active">Products</a>
        <a href="sales.html">Sales</a>
        <a href="inventory.html">Inventory</a>
    </div>
    <div class="main-content">
        <h2 class="page-title">Add New Products</h2>
        <p style="margin-bottom:20px;color:#555;">Fill in the details below to add items to your stock.</p>
        <div class="container">
            <input class="name" placeholder="Product Name" type="text">
            <input class="price" placeholder="Price" type="number" min="0">
            <input class="quantity" placeholder="Quantity" type="number" min="1">
            <button onclick="add_fun()">Add Product</button>
        </div>
        <div class="show"></div>
    </div>
    <script src="javamain.js"></script>
</body>
