<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SuperMarket - Sales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1>SuperMarket</h1>
        <a href="index.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="sales.html" class="active">Sales</a>
        <a href="inventory.html">Inventory</a>
    </div>
    <div class="main-content">
        <h2 class="page-title">Process a Sale</h2>
        <p style="margin-bottom:20px;color:#555;">Select a product and enter quantity to record a sale.</p>
        <div class="container">
            <select id="saleName"></select>
            <input type="number" id="saleQty" placeholder="Quantity to Sell" min="1">
            <button onclick="makeSale()" style="background-color:#e67e22;">Confirm Sale</button>
        </div>
        <div id="saleStatus" style="margin-top:20px;font-weight:bold;"></div>
    </div>
    <script src="javamain.js"></script>
</body>
</html>
